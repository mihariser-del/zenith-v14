<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Select an area</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  #dim { position: fixed; inset: 0; background: rgba(5, 8, 20, .45); }
  #box { position: fixed; display: none; border: 2px solid #60a5fa; box-shadow: 0 0 0 99999px rgba(5, 8, 20, .45); background: transparent; }
  #tip { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: rgba(13, 23, 54, .92); color: #e8edfb; font: 600 14px "Segoe UI", system-ui, sans-serif; border: 1px solid rgba(122, 152, 255, .35); }
  #size { position: fixed; display: none; padding: 3px 8px; border-radius: 6px; background: #2563eb; color: #fff; font: 600 12px "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<img id="shot" alt="">
<div id="dim"></div>
<div id="box"></div>
<div id="size"></div>
<div id="tip">Drag around the part you want Zelpophai Mini to look at · Esc to cancel</div>
<script>
  const shot = document.getElementById('shot'), box = document.getElementById('box'), dim = document.getElementById('dim'), size = document.getElementById('size');
  let start = null;
  window.zpRegion.onImage((src) => { shot.src = src; });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.zpRegion.done(null); });
  addEventListener('mousedown', (e) => {
    if (e.button !== 0) { window.zpRegion.done(null); return; }
    start = { x: e.clientX, y: e.clientY };
    dim.style.display = 'none'; box.style.display = 'block'; size.style.display = 'block';
    draw(e);
  });
  addEventListener('mousemove', (e) => { if (start) draw(e); });
  addEventListener('mouseup', (e) => {
    if (!start) return;
    const r = rect(e); start = null;
    if (r.w < 8 || r.h < 8) { window.zpRegion.done(null); return; }
    window.zpRegion.done({ x: r.x / innerWidth, y: r.y / innerHeight, w: r.w / innerWidth, h: r.h / innerHeight });
  });
  function rect(e) {
    const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
    return { x, y, w: Math.abs(e.clientX - start.x), h: Math.abs(e.clientY - start.y) };
  }
  function draw(e) {
    const r = rect(e);
    Object.assign(box.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    size.textContent = Math.round(r.w) + ' × ' + Math.round(r.h);
    Object.assign(size.style, { left: r.x + 'px', top: Math.max(0, r.y - 26) + 'px' });
  }
</script>
</body>
</html>
