<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta property="og:title" id="og-title" content="Zenith — Shared Chat">
    <meta property="og:description" content="View a shared conversation on Zenith AI.">
    <meta name="theme-color" content="#0066ff">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta name="description" content="Zenith AI shared conversation">
    <title>Shared Chat · Zenith</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <style>
        :root { --bg: #05080f; --panel:#0b1220; --card:#0f1728; --line:#1c2740; --text:#e8eef7; --muted:#8a94a8; --accent:#4CC9F0; --accent2:#0066ff; --gold:#FFD700; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
        ::selection { background:rgba(76,201,240,.3); }

        .bg-glow { position:fixed; inset:0; z-index:0; pointer-events:none; background:
            radial-gradient(600px 300px at 80% -10%, rgba(0,102,255,.14), transparent 70%),
            radial-gradient(500px 320px at 10% 10%, rgba(76,201,240,.08), transparent 70%),
            radial-gradient(700px 400px at 50% 110%, rgba(58,12,163,.12), transparent 70%); }

        .nav { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:18px 6vw; }
        .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text); }
        .logo { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 4px 18px rgba(0,102,255,.4); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#fff; }
        .brand-name { font-weight:800; font-size:17px; letter-spacing:.2px; }
        .brand-name em { font-style:normal; color:var(--accent); }
        .nav-badge { font-size:12px; color:var(--muted); background:rgba(76,201,240,.08); border:1px solid rgba(76,201,240,.25); padding:6px 14px; border-radius:100px; font-weight:600; }

        .hero { position:relative; z-index:1; text-align:center; padding:52px 24px 34px; }
        .hero .tag { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:1.5px; color:var(--accent); text-transform:uppercase; background:rgba(76,201,240,.07); border:1px solid rgba(76,201,240,.2); padding:7px 16px; border-radius:100px; margin-bottom:22px; }
        .hero .tag .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
        .hero h1 { font-size:clamp(26px,5vw,44px); font-weight:800; line-height:1.15; margin:0 auto 14px; max-width:820px; letter-spacing:-.5px; }
        .hero h1 .hl { background:linear-gradient(90deg,var(--accent),#7dd3fc 45%,var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .hero .meta { color:var(--muted); font-size:14px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
        .hero .meta .sep { opacity:.35; }
        .hero .owner { display:inline-flex; align-items:center; gap:8px; }
        .hero .owner .ava { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--accent2),var(--accent)); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; }

        .cta-wrap { position:relative; z-index:1; text-align:center; margin:6px 0 44px; }
        .cta { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#0066ff,#00aaff); color:#fff; font-weight:700; font-size:15px; padding:14px 30px; border-radius:14px; text-decoration:none; box-shadow:0 8px 30px rgba(0,102,255,.35), inset 0 1px 0 rgba(255,255,255,.14); transition:transform .15s ease, box-shadow .15s ease; }
        .cta:hover { transform:translateY(-2px); box-shadow:0 12px 38px rgba(0,102,255,.45); }
        .cta .arr { transition:transform .15s ease; }
        .cta:hover .arr { transform:translateX(4px); }

        .thread { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:0 20px 90px; }
        .conv-card { background:linear-gradient(180deg,rgba(15,23,40,.7),rgba(11,18,32,.9)); border:1px solid var(--line); border-radius:22px; padding:8px 0; box-shadow:0 20px 60px rgba(0,0,0,.35); backdrop-filter:blur(8px); overflow:hidden; }

        .day-sep { text-align:center; font-size:11px; letter-spacing:1.2px; color:var(--muted); text-transform:uppercase; margin:20px 0; }

        .m { display:flex; gap:14px; padding:18px 22px; border-bottom:1px solid rgba(28,39,64,.5); animation:rise .35s ease both; }
        .m:last-child { border-bottom:none; }
        @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        .m .ava { width:34px; height:34px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; }
        .m.user .ava { background:linear-gradient(135deg,#233a5f,#16233c); color:#8db4ff; border:1px solid #2c4a7c; }
        .m.ai .ava { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; box-shadow:0 4px 14px rgba(0,102,255,.35); }
        .m .who { font-size:12px; font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:8px; }
        .m.user .who { color:#8db4ff; }
        .m.ai .who { color:var(--accent); }
        .m .who .lbl { font-size:10px; font-weight:600; color:var(--muted); background:rgba(138,148,168,.08); border:1px solid rgba(138,148,168,.15); padding:2px 8px; border-radius:100px; }
        .m .body { flex:1; min-width:0; }
        .m .content { font-size:15px; line-height:1.7; color:#dde7f4; }
        .m .content p { margin:0 0 12px; }
        .m .content p:last-child { margin-bottom:0; }
        .m .content code { background:rgba(120,140,180,.14); padding:2px 7px; border-radius:6px; font-size:13px; font-family:"SF Mono",Consolas,monospace; }
        .m .content pre { background:#0a0f1c; border:1px solid var(--line); border-radius:12px; padding:14px 16px; overflow-x:auto; margin:10px 0; position:relative; }
        .m .content pre code { background:none; padding:0; font-size:13px; line-height:1.55; }
        .m .content table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13.5px; }
        .m .content th, .m .content td { border:1px solid var(--line); padding:8px 12px; text-align:left; }
        .m .content th { background:rgba(138,148,168,.08); }
        .m .content blockquote { border-left:3px solid var(--accent); margin:10px 0; padding:2px 14px; color:var(--muted); }
        .m .content img { max-width:100%; border-radius:10px; }
        .m .toolbar { display:flex; gap:8px; margin-top:10px; opacity:0; transition:opacity .15s ease; }
        .m:hover .toolbar { opacity:1; }
        .m .toolbar button { background:rgba(138,148,168,.06); color:var(--muted); border:1px solid rgba(138,148,168,.15); font-size:11.5px; font-weight:600; padding:5px 12px; border-radius:8px; cursor:pointer; transition:color .15s ease, background .15s ease; font-family:inherit; }
        .m .toolbar button:hover { color:var(--accent); background:rgba(76,201,240,.1); }

        .m .reacts { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:12px; padding-top:12px; border-top:1px dashed rgba(28,39,64,.55); }
        .m .reacts .rlbl { font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-right:2px; }
        .m .reacts button {
            display:inline-flex; align-items:center; gap:5px;
            background:rgba(138,148,168,.06); color:#c6d0e2;
            border:1px solid rgba(138,148,168,.18); font-size:12.5px; font-weight:600;
            padding:4px 11px; border-radius:100px; cursor:pointer;
            transition:transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease; font-family:inherit;
        }
        .m .reacts button:hover { transform:translateY(-1px); background:rgba(76,201,240,.12); border-color:rgba(76,201,240,.4); color:var(--accent); }
        .m .reacts button.on { background:rgba(76,201,240,.16); border-color:#4CC9F0; color:#7fd9f5; box-shadow:0 0 12px rgba(76,201,240,.3); }
        .m .reacts button .cnt { font-size:11px; color:var(--muted); min-width:10px; }
        .m .reacts button.on .cnt { color:#7fd9f5; }
        .reacts-tip { font-size:10.5px; color:rgba(138,148,168,.55); margin-left:2px; }

        .readmore { transition:max-height .3s ease; }
        .readmore.closed { overflow:hidden; }

        .footer { position:relative; z-index:1; text-align:center; padding:34px 20px 70px; color:var(--muted); font-size:13px; }
        .footer .heart { color:#ff5d73; }
        .footer a { color:var(--accent); text-decoration:none; }

        .states { position:relative; z-index:1; max-width:520px; margin:80px auto; text-align:center; padding:0 20px; }
        .states .ic { font-size:46px; margin-bottom:12px; }
        .states h2 { margin:0 0 8px; font-weight:800; font-size:22px; }
        .states p { color:var(--muted); font-size:14px; margin-bottom:24px; }

        @media (max-width:600px) {
            .m { padding:14px 14px; }
            .hero { padding-top:38px; }
        }

        .nav { position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); background:rgba(5,8,15,.72); border-bottom:1px solid rgba(28,39,64,.5); }
        .nav .copy-link-btn { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--accent); background:rgba(76,201,240,.08); border:1px solid rgba(76,201,240,.3); padding:8px 15px; border-radius:100px; cursor:pointer; transition:transform .15s ease, background .15s ease; font-family:inherit; }
        .nav .copy-link-btn:hover { transform:translateY(-1px); background:rgba(76,201,240,.16); }

        .chat-window { position:relative; z-index:1; max-width:780px; margin:26px auto 0; padding:0 16px; }
        .chat-public-tag { display:flex; justify-content:center; margin-bottom:12px; }
        .chat-public-tag span { display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); background:rgba(76,201,240,.07); border:1px solid rgba(76,201,240,.22); padding:6px 14px; border-radius:100px; }
        .chat-public-tag .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); animation:pulse 1.8s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

        .chat-head { display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--card); border:1px solid var(--line); border-bottom:1px dashed rgba(28,39,64,.6); border-radius:18px 18px 0 0; padding:16px 18px; }
        .chat-head-left { display:flex; align-items:center; gap:12px; min-width:0; }
        .head-ava { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 4px 16px rgba(0,102,255,.4); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0; }
        .head-title { font-weight:800; font-size:16px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .head-meta { font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .who-owner { color:#8db4ff; font-weight:600; }
        .head-copy { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#cfefff; background:linear-gradient(135deg,#0066ff,#4CC9F0); border:none; padding:10px 16px; border-radius:11px; cursor:pointer; box-shadow:0 6px 20px rgba(0,102,255,.35); transition:transform .15s ease, box-shadow .15s ease; font-family:inherit; white-space:nowrap; }
        .head-copy:hover { transform:translateY(-1px); box-shadow:0 9px 26px rgba(0,102,255,.45); }

        .thread { padding:0 0 90px; }
        .thread .conv-card { border-radius:0 0 20px 20px; }

        .m.user { flex-direction:row-reverse; }
        .m.user .body { display:flex; flex-direction:column; align-items:flex-end; max-width:86%; text-align:right; }
        .m.user .who { flex-direction:row-reverse; }
        .m .content { padding:2px 14px; }
        .m.ai .content { background:rgba(21,32,56,.55); border:1px solid rgba(28,39,64,.55); border-radius:4px 16px 16px 16px; }
        .m.user .content { background:linear-gradient(135deg,#1a4f9e,#0e3a86); border:1px solid rgba(76,201,240,.25); border-radius:16px 4px 16px 16px; color:#e8f3ff; }
        .m.user .content code { background:rgba(255,255,255,.12); }
        .m.user .toolbar, .m.user .reacts { justify-content:flex-end; }
        .m.user .toolbar button { background:rgba(255,255,255,.08); color:#cfe7ff; border-color:rgba(255,255,255,.16); }
        .m.user .reacts { border-top-color:rgba(76,201,240,.25); }
        .m.user .rlbl { color:#7fd9f5; }

        @media (max-width:520px) {
            .head-copy { font-size:12px; padding:9px 12px; }
            .m.user .body { max-width:92%; }
            .m { gap:10px; }
        }
    </style>
</head>
<body>
<div class="bg-glow"></div>

<nav class="nav">
    <a class="brand" href="/">
        <div class="logo">Z</div>
        <span class="brand-name">Zenith<em>.ai</em></span>
    </a>
    <div style="display:flex; align-items:center; gap:10px;">
        <button class="copy-link-btn" id="navCopy">🔗 Copy link</button>
        <span class="nav-badge">✦ Shared conversation</span>
    </div>
</nav>

<div id="loading" class="states">
    <div class="ic">🌀</div>
    <h2>Loading conversation...</h2>
    <p>Fetching the shared chat.</p>
</div>

<div id="content" style="display:none;">
    <div class="chat-window">
        <div class="chat-public-tag"><span><span class="dot"></span> Public conversation</span></div>
        <header class="chat-head">
            <div class="chat-head-left">
                <div class="head-ava" id="ownerAva">?</div>
                <div style="min-width:0;">
                    <div class="head-title" id="title"></div>
                    <div class="head-meta">
                        <span class="who-owner" id="owner"></span>
                        <span>·</span><span id="count"></span>
                        <span>·</span><span id="date"></span>
                    </div>
                </div>
            </div>
            <button class="head-copy" id="headCopy">🔗 Copy link</button>
        </header>
        <div class="thread">
            <div class="conv-card" id="messages"></div>
        </div>
    </div>
    <div class="cta-wrap">
        <a class="cta" href="/">Join Zenith — it's free <span class="arr">→</span></a>
    </div>
</div>

<div id="notfound" class="states" style="display:none;">
    <div class="ic">🔒</div>
    <h2>This shared chat isn't available</h2>
    <p>It may have been unshared or the link is invalid.</p>
    <a href="/" style="color:var(--accent); font-weight:700;">Go to Zenith →</a>
</div>

<footer class="footer">
    Crafted with <span class="heart">♥</span> by Wanzu Ibrahim · <a href="/status">System status</a>
</footer>

<script>
    const shareId = window.location.pathname.split('/').filter(Boolean).pop();
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const nfEl = document.getElementById('notfound');
    const markedOpts = { breaks: true, gfm: true };
    if (window.marked) marked.setOptions(markedOpts);

    const escapeHtml = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function render(markdown) {
        if (!window.marked) return '<div class="markdown-body">' + escapeHtml(markdown || '').replace(/\n/g,'<br>') + '</div>';
        try { return window.DOMPurify.sanitize(window.marked.parse(markdown || '')); }
        catch(e) { return escapeHtml(markdown || '').replace(/\n/g,'<br>'); }
    }

    function copyText(t, btn) {
        const done = () => { if (btn) { const o = btn.textContent; btn.textContent = 'Copied ✓'; btn.style.color = '#3fb950'; setTimeout(()=>{ btn.textContent = o; btn.style.color = ''; }, 1400); } };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done);
        else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); done(); }
    }

    function addCopyToCode(el) {
        el.querySelectorAll('pre').forEach(pre => {
            if (pre.querySelector('.copy-code')) return;
            const btn = document.createElement('button');
            btn.className = 'copy-code';
            btn.textContent = 'Copy';
            btn.style.cssText = 'position:absolute; top:10px; right:10px; background:rgba(138,148,168,.12); color:#aab4c8; border:1px solid rgba(138,148,168,.2); font-size:11px; font-weight:600; padding:4px 10px; border-radius:7px; cursor:pointer; z-index:2;';
            btn.addEventListener('click', () => copyText(pre.innerText, btn));
            pre.style.position = 'relative';
            pre.appendChild(btn);
        });
    }

    const EMOJIS = ['👍','❤️','😂','🔥','🎉','👏'];

    const navCopy = document.getElementById('navCopy');
    const headCopy = document.getElementById('headCopy');
    [navCopy, headCopy].forEach(b => {
        if (b) b.addEventListener('click', () => copyText(window.location.href, b));
    });
    const storageKey = 'zx_reacts_' + shareId;
    let myReacts = {};
    try { myReacts = JSON.parse(sessionStorage.getItem(storageKey) || '{}'); } catch(e) {}
    const reactCounts = {};

    function countsFor(m) {
        try { return JSON.parse(m.viewer_reactions || '{}'); } catch(e) { return {}; }
    }

    function buildReacts(m) {
        const wrap = document.createElement('div');
        wrap.className = 'reacts';
        const lbl = document.createElement('span');
        lbl.className = 'rlbl';
        lbl.textContent = 'React';
        wrap.appendChild(lbl);
        EMOJIS.forEach(em => {
            const b = document.createElement('button');
            b.appendChild(document.createTextNode(em));
            const c = document.createElement('span');
            c.className = 'cnt';
            b.appendChild(c);
            b.dataset.rid = m.id;
            b.dataset.em = em;
            b.addEventListener('click', () => onReact(m.id, em));
            wrap.appendChild(b);
        });
        const tip = document.createElement('span');
        tip.className = 'reacts-tip';
        tip.textContent = 'Reactions are seen by the chat owner';
        wrap.appendChild(tip);
        return wrap;
    }

    function refreshReacts() {
        document.querySelectorAll('.reacts button').forEach(b => {
            const counts = reactCounts[b.dataset.rid] || {};
            const n = counts[b.dataset.em] || 0;
            b.querySelector('.cnt').textContent = n > 0 ? n : '';
            b.classList.toggle('on', myReacts[b.dataset.rid] === b.dataset.em);
        });
    }

    async function onReact(rid, em) {
        const counts = reactCounts[rid] || (reactCounts[rid] = {});
        const cur = myReacts[rid] || null;
        const remove = cur === em;
        if (remove) {
            counts[em] = Math.max((counts[em] || 1) - 1, 0);
        } else {
            counts[em] = (counts[em] || 0) + 1;
            if (cur) counts[cur] = Math.max((counts[cur] || 1) - 1, 0);
        }
        myReacts[rid] = remove ? null : em;
        try { sessionStorage.setItem(storageKey, JSON.stringify(myReacts)); } catch(e) {}
        refreshReacts();
        try {
            await fetch('/api/s/' + encodeURIComponent(shareId) + '/messages/' + rid + '/react', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emoji: em, remove: remove })
            });
        } catch(e) {}
        refreshReacts();
    }

    (async () => {
        if (!shareId) { loadingEl.style.display='none'; nfEl.style.display='block'; return; }
        try {
            const res = await fetch('/api/s/' + encodeURIComponent(shareId));
            if (!res.ok) throw new Error('nf');
            const data = await res.json();
            if (data.detail) throw new Error('nf');

            const title = data.title || 'Shared Chat';
            document.title = title + ' · Zenith';
            document.getElementById('og-title').content = title + ' — shared on Zenith';
            document.getElementById('title').textContent = title;
            document.getElementById('og-title').setAttribute('content', title + ' — shared on Zenith');
            const owner = data.owner || 'someone';
            document.getElementById('owner').textContent = owner;
            document.getElementById('ownerAva').textContent = (owner[0]||'?').toUpperCase();
            document.getElementById('count').textContent = (data.message_count||0) + ' messages';
            document.getElementById('date').textContent = data.shared_at ? new Date(data.shared_at).toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' }) : '';

            const box = document.getElementById('messages');
            const msgs = data.messages || [];
            const isUser = m => m.role === 'user';
            msgs.forEach((m, i) => {
                reactCounts[m.id] = countsFor(m);
                const div = document.createElement('div');
                div.className = 'm ' + (isUser(m) ? 'user' : 'ai');
                div.style.animationDelay = Math.min(i * 40, 600) + 'ms';
                const inner = document.createElement('div');
                inner.className = 'content';
                inner.innerHTML = render(m.content);
                addCopyToCode(inner);
                if (window.hljs) inner.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch(e){} });
                const toolbar = document.createElement('div');
                toolbar.className = 'toolbar';
                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy';
                copyBtn.addEventListener('click', () => copyText(m.content || '', copyBtn));
                toolbar.appendChild(copyBtn);
                div.innerHTML = `
                    <div class="ava">${isUser(m) ? 'YOU' : 'Z'}</div>
                    <div class="body">
                        <div class="who">${isUser(m) ? 'You' : 'Zenith'}<span class="lbl">${isUser(m) ? 'Human' : 'AI'}</span></div>
                    </div>`;
                div.querySelector('.body').appendChild(inner);
                div.querySelector('.body').appendChild(toolbar);
                div.querySelector('.body').appendChild(buildReacts(m));
                box.appendChild(div);
            });
            refreshReacts();

            const collapsible = box.querySelectorAll('.content');
            // collapse very long assistant messages beyond 90vh
            collapsible.forEach(el => {
                if (el.scrollHeight > window.innerHeight * 1.2 && el.parentElement.classList.contains('m')) {
                    const wrap = el.parentElement.querySelector('.body');
                    const more = document.createElement('button');
                    more.textContent = 'Show full message';
                    more.style.cssText = 'margin-top:8px; color:var(--accent); background:none; border:1px solid rgba(76,201,240,.3); font-size:12px; font-weight:600; padding:7px 14px; border-radius:9px; cursor:pointer; font-family:inherit;';
                    more.addEventListener('click', () => { el.style.maxHeight = 'none'; more.remove(); });
                    el.classList.add('readmore','closed');
                    el.style.maxHeight = Math.min(el.scrollHeight, window.innerHeight) + 'px';
                    more.addEventListener('click', () => { el.style.maxHeight = 'none'; el.classList.remove('closed'); more.remove(); });
                    el.addEventListener('click', function h() { if (el.classList.contains('closed')) { el.style.maxHeight='none'; el.classList.remove('closed'); more.remove(); el.removeEventListener('click', h); } });
                    wrap.appendChild(more);
                }
            });

            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            window.scrollTo(0,0);
        } catch (e) {
            loadingEl.style.display = 'none';
            nfEl.style.display = 'block';
        }
    })();
</script>
</body>
</html>
