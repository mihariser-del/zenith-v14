<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Access &middot; Zelpophai AI</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32-v2.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16-v2.png">
    <link rel="manifest" href="/static/manifest.json?v=2">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-v2.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/vault.css">
    <style>
        html, body { height: 100%; }
        body.va-page {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(1100px 600px at 50% -8%, #1a2140 0%, #0c0f16 58%, #0a0c10 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #DDE4EE;
        }
        /* Keyboard-only capture field: invisible, but focusable so phone
           keyboards still pop up. No on-screen keypad by design. */
        #va-capture {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            border: none;
            background: transparent;
            color: transparent;
            caret-color: transparent;
        }
        .va-hint { font-size: 12px; color: #6B7280; margin-top: 18px; letter-spacing: .3px; }
        .va-keyboard-ic { font-size: 15px; vertical-align: -2px; margin-right: 5px; }
        .va-actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
        .va-link { font-size: 12px; color: #8B949E; text-decoration: none; padding: 8px 14px; border: 1px solid #2a2f36; border-radius: 10px; }
        .va-link:hover { color: #DDE4EE; border-color: #60A5FA; }
        .va-pw-input {
            width: 100%; margin-top: 6px; padding: 12px 14px; background: #0f1218;
            border: 1px solid #2A3140; border-radius: 10px; color: #E6EAF2;
            font-size: 14px; outline: none; text-align: left;
        }
        .va-pw-input:focus { border-color: #60A5FA; }
        .va-label { font-size: 11px; color: #8B949E; margin-bottom: 6px; letter-spacing: 1px; text-align: left; }
        .va-err { margin-top: 16px; font-size: 12px; color: #EF4444; min-height: 18px; }
        .va-dots { display: flex; gap: 14px; justify-content: center; margin: 8px 0 4px; }
    </style>
</head>
<body class="va-page">
    <div class="vault-welcome-card">
        <div class="vault-welcome-logo" id="va-avatar">Z</div>
        <div class="vault-welcome-brand">ZELPOPHAI AI</div>
        <div id="va-title" class="vault-welcome-title">WELCOME TO THE VAULT</div>
        <div class="vault-welcome-line"></div>
        <div id="va-name" class="vault-welcome-name">Loading...</div>
        <div id="va-role" class="vault-welcome-role">OWNER</div>

        <div id="va-pin-block">
            <div id="va-sub" class="vault-pin-sub">Enter your PIN to continue</div>
            <div id="va-dots" class="va-dots">
                <div class="vault-pin-dot"></div><div class="vault-pin-dot"></div><div class="vault-pin-dot"></div><div class="vault-pin-dot"></div>
            </div>
            <div class="va-hint"><span class="va-keyboard-ic">&#9000;</span>Type your 4&#8209;digit PIN &middot; Backspace to delete &middot; Enter to submit</div>
        </div>

        <div id="va-pw-block" style="display:none; margin-top:16px;">
            <div class="va-label">CONFIRM YOUR ACCOUNT PASSWORD</div>
            <input id="va-pw" class="va-pw-input" type="password" autocomplete="current-password" placeholder="Account password">
            <div class="va-hint" style="margin-top:12px;">Press Enter to enable PIN lock</div>
        </div>

        <div id="va-err" class="va-err"></div>

        <div class="va-actions">
            <a class="va-link" href="/app">&larr; Back to app</a>
        </div>
    </div>

    <input id="va-capture" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true">

    <script src="/static/js/api.js"></script>
    <script src="/static/js/vault-auth.js"></script>
</body>
</html>
