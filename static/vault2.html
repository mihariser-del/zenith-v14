<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vault · Zelpophai AI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/vault2.css">
<link rel="stylesheet" href="/static/css/vault-auth-fx.css">
<script>
  // 26.7: arriving from the Vault PIN page — show the last frame of the film until the dashboard is ready
  try { if (/[?&]arrive=1/.test(location.search)) document.documentElement.classList.add('zv-arrive'); } catch (e) {}
</script>
<style>
  #zv-arrive{display:none}
  html.zv-arrive #zv-arrive{display:block;position:fixed;inset:0;z-index:2147482000;background:#02030a url(/static/img/cosmic/command.jpg) center 46%/cover no-repeat;transition:opacity .85s ease;color:#e8ecf8;font-family:Inter,system-ui,sans-serif}
  #zv-arrive.out{opacity:0;pointer-events:none}
  #zv-arrive .w{position:absolute;left:50%;top:21%;transform:translateX(-50%);text-align:center;width:min(92vw,900px)}
  #zv-arrive .k{font:300 clamp(13px,1.5vw,18px)/1 Inter,sans-serif;letter-spacing:.7em;text-indent:.7em;color:#cfd8f4}
  #zv-arrive .rule{width:min(420px,60vw);height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,rgba(190,205,255,.85),transparent)}
  #zv-arrive .n{font:600 clamp(30px,5.4vw,68px)/1.05 Inter,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 0 30px rgba(140,160,255,.35);word-break:break-word;min-height:1em}
  #zv-arrive .r{display:inline-block;margin-top:18px;font:600 11px/1 Inter,sans-serif;letter-spacing:.5em;text-indent:.5em;color:#d7dcf0;padding:9px 16px;border:1px solid rgba(200,210,255,.35);border-radius:2px;background:rgba(10,14,30,.35)}
</style>
<script>
  // Theme before paint (no flash)
  try { const t = localStorage.getItem('zv_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="/static/vendor/chart-4.4.1.umd.min.js"></script>
</head>
<body>
<div class="zv" id="zv">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="/app" title="Back to Zelpophai"><span class="logo">Z</span><span><b>Vault</b><small id="who-role">Owner</small></span></a>
      <button class="ib only-m" id="side-close" aria-label="Close menu">✕</button>
    </div>
    <button class="search-btn" id="open-k" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a href="/app" class="classic">← Back to Zelpophai</a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="ib only-m" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="title"><small id="crumb">Vault</small><h1 id="page-title">Overview</h1></div>
      <div class="top-actions">
        <div class="ranges" id="ranges" role="group" aria-label="Date range">
          <button data-r="24h">24h</button><button data-r="7d">7d</button><button data-r="30d" class="on">30d</button><button data-r="90d">90d</button>
        </div>
        <span class="online-pill" id="online-pill" title="People online now"><i></i><b>0</b> online</span>
        <button class="ib" id="bell" aria-label="Alerts" title="Alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><em id="bell-n" hidden>0</em></button>
        <button class="ib" id="theme" aria-label="Light or dark" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="ib" id="lock" aria-label="Lock the Vault" title="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      </div>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
  </main>
</div>

<!-- alerts panel -->
<div class="panel" id="alerts-panel" hidden>
  <div class="panel-head"><b>Alerts</b><div><button class="btn sm" id="ack-all">Mark all read</button><button class="ib" data-close>✕</button></div></div>
  <div class="panel-body" id="alerts-list"></div>
</div>

<!-- command palette -->
<div class="cmdk" id="cmdk" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="cmdk-box">
    <input id="cmdk-in" placeholder="Search people, pages and actions…" autocomplete="off">
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot"><span>↑↓ to move · Enter to open · Esc to close</span></div>
  </div>
</div>

<!-- 26.7: the film's last frame, held while the dashboard loads (purely visual; the token is still checked) -->
<div id="zv-arrive" aria-hidden="true"><div class="w"><div class="k">WELCOME TO THE VAULT</div><div class="rule"></div><div class="n" id="zv-arrive-name"></div><div class="r" id="zv-arrive-role">OWNER</div></div></div>
<script>
  try {
    var zva = JSON.parse(sessionStorage.getItem('zv_arrive') || 'null'); sessionStorage.removeItem('zv_arrive');
    if (zva) { document.getElementById('zv-arrive-name').textContent = String(zva.n || '').toUpperCase(); document.getElementById('zv-arrive-role').textContent = String(zva.r || ''); }
    // safety net: never leave the frame up if the dashboard can't start
    setTimeout(function () { var a = document.getElementById('zv-arrive'); if (a && !a.hidden) { a.classList.add('out'); setTimeout(function () { a.hidden = true; document.documentElement.classList.remove('zv-arrive'); }, 900); } }, 15000);
  } catch (e) {}
</script>

<!-- modal -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>

<!-- lock -->
<div class="lockscreen" id="lockscreen" hidden>
  <div class="va-bg" aria-hidden="true">
    <div class="va-aur a1"></div><div class="va-aur a2"></div><div class="va-aur a3"></div><div class="va-aur a4"></div>
    <div class="va-grid"></div><div class="va-scan"></div>
    <canvas id="va-stars"></canvas>
  </div>
  <div class="va-top">
    <div><div class="va-clock" id="va-clock">--:--</div><div class="va-date" id="va-date"></div></div>
    <div class="va-chips">
      <span class="va-chip"><span class="va-live"></span>Secure connection</span>
      <span class="va-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Encrypted</span>
      <span class="va-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Locks after 15 minutes away</span>
    </div>
  </div>
  <div class="lock-box">
    <div class="va-logo-wrap"><div class="va-orbit"><i></i></div><span class="logo big">Z</span></div>
    <div class="lock-kicker">ZELPOPHAI AI · VAULT</div>
    <h2>Vault locked</h2>
    <p>Enter your Vault PIN to continue.</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••">
    <div class="lock-err" id="pin-err"></div>
    <button class="btn pri wide" id="pin-go">Unlock</button>
    <a href="/app" class="muted-link">Back to Zelpophai</a>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/static/js/vault-fx.js"></script>
<script src="/static/js/vault-cutscene.js"></script>
<script src="/static/js/vault2.js"></script>
</body>
</html>
