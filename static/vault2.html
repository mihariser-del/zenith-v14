<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vault · Zelpophai AI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/vault2.css">
<script>
  // Theme before paint (no flash)
  try { const t = localStorage.getItem('zv_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="/static/vendor/chart-4.4.1.umd.min.js"></script>
</head>
<body>
<div class="zv" id="zv">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="/app" title="Back to Zelpophai"><span class="logo">Z</span><span><b>Vault</b><small id="who-role">Owner</small></span></a>
      <button class="ib only-m" id="side-close" aria-label="Close menu">✕</button>
    </div>
    <button class="search-btn" id="open-k" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a href="/vault/classic" class="classic">Classic Vault tools ↗</a>
      <a href="/app" class="classic">← Back to Zelpophai</a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="ib only-m" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="title"><small id="crumb">Vault</small><h1 id="page-title">Overview</h1></div>
      <div class="top-actions">
        <div class="ranges" id="ranges" role="group" aria-label="Date range">
          <button data-r="24h">24h</button><button data-r="7d">7d</button><button data-r="30d" class="on">30d</button><button data-r="90d">90d</button>
        </div>
        <span class="online-pill" id="online-pill" title="People online now"><i></i><b>0</b> online</span>
        <button class="ib" id="bell" aria-label="Alerts" title="Alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><em id="bell-n" hidden>0</em></button>
        <button class="ib" id="theme" aria-label="Light or dark" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="ib" id="lock" aria-label="Lock the Vault" title="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      </div>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
  </main>
</div>

<!-- alerts panel -->
<div class="panel" id="alerts-panel" hidden>
  <div class="panel-head"><b>Alerts</b><div><button class="btn sm" id="ack-all">Mark all read</button><button class="ib" data-close>✕</button></div></div>
  <div class="panel-body" id="alerts-list"></div>
</div>

<!-- command palette -->
<div class="cmdk" id="cmdk" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="cmdk-box">
    <input id="cmdk-in" placeholder="Search people, pages and actions…" autocomplete="off">
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot"><span>↑↓ to move · Enter to open · Esc to close</span></div>
  </div>
</div>

<!-- modal -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>

<!-- lock -->
<div class="lockscreen" id="lockscreen" hidden>
  <div class="lock-box">
    <span class="logo big">Z</span>
    <h2>Vault locked</h2>
    <p>Enter your Vault PIN to continue.</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••">
    <div class="lock-err" id="pin-err"></div>
    <button class="btn pri wide" id="pin-go">Unlock</button>
    <a href="/app" class="muted-link">Back to Zelpophai</a>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/static/js/vault2.js"></script>
</body>
</html>
