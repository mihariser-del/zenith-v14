<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Can't View This Chat · Quolvex AI</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --g-bg: #0a0316; --g-text: #f7f2ff; --g-muted: #b6a8e0;
            --g-cyan: #22d3ee; --g-pink: #ff3db4; --g-violet: #8b5cf6; --g-gold: #ffd23f;
        }
        body {
            margin: 0; padding: 0; min-height: 100vh;
            background: var(--g-bg); color: var(--g-text);
            display: flex;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden; overflow-y: auto;
        }
        .bg-anim {
            position: fixed; inset: -20%; z-index: 0; pointer-events: none;
            background:
                radial-gradient(700px 500px at 15% 10%, rgba(34,211,238,.18), transparent 65%),
                radial-gradient(800px 600px at 85% 20%, rgba(255,61,180,.20), transparent 65%),
                radial-gradient(700px 500px at 50% 112%, rgba(139,92,246,.28), transparent 60%);
            filter: blur(6px);
            animation: drift 16s ease-in-out infinite alternate;
        }
        @keyframes drift { from { transform: translate(-2%, -1%) rotate(-1deg); } to { transform: translate(2%, 1%) rotate(1deg); } }
        .sparkles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .sparkles i { position: absolute; display: block; font-style: normal; animation: twinkle 3s ease-in-out infinite; }
        .sparkles i:nth-child(1) { top: 16%; left: 9%; font-size: 18px; color: var(--g-gold); text-shadow: 0 0 12px var(--g-gold); }
        .sparkles i:nth-child(2) { top: 32%; right: 11%; font-size: 13px; color: var(--g-cyan); text-shadow: 0 0 12px var(--g-cyan); animation-delay: .8s; }
        .sparkles i:nth-child(3) { bottom: 26%; left: 15%; font-size: 15px; color: var(--g-pink); text-shadow: 0 0 12px var(--g-pink); animation-delay: 1.6s; }
        .sparkles i:nth-child(4) { bottom: 14%; right: 17%; font-size: 20px; color: var(--g-gold); text-shadow: 0 0 12px var(--g-gold); animation-delay: 2.2s; }
        @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
        .card {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px; margin: auto; padding: 28px 16px;
            background: linear-gradient(160deg, rgba(28,13,64,.92), rgba(17,10,51,.95));
            border: 1px solid rgba(139,92,246,.55);
            border-radius: 22px; padding: 44px 34px 32px; text-align: center;
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 70px rgba(139,92,246,.22), inset 0 1px 0 rgba(255,255,255,.06);
            animation: rise .5s ease-out; position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 2px;
            background: linear-gradient(90deg, transparent, #22d3ee, #ff3db4, #ffd23f, transparent);
        }
        @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
        .ic-box {
            width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 24px;
            display: flex; align-items: center; justify-content: center; font-size: 38px;
        }
        .ic-box.locked { background: rgba(255,210,63,.08); border: 1px solid rgba(255,210,63,.4); box-shadow: 0 12px 40px rgba(255,210,63,.3); }
        .ic-box.gone { background: rgba(255,61,180,.08); border: 1px solid rgba(255,61,180,.4); box-shadow: 0 12px 40px rgba(255,61,180,.3); }
        .tag-pill {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 7px 14px; border-radius: 100px; margin-bottom: 14px;
        }
        .tag-pill.login { color: var(--g-gold); background: rgba(255,210,63,.08); border: 1px solid rgba(255,210,63,.35); box-shadow: 0 0 14px rgba(255,210,63,.2); }
        .tag-pill.owner { color: var(--g-cyan); background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.35); box-shadow: 0 0 14px rgba(34,211,238,.2); }
        .tag-pill.gone { color: var(--g-pink); background: rgba(255,61,180,.08); border: 1px solid rgba(255,61,180,.35); box-shadow: 0 0 14px rgba(255,61,180,.2); }
        h1 {
            font-size: 23px; font-weight: 900; margin: 0 0 10px; letter-spacing: -.3px;
            background: linear-gradient(90deg, #22d3ee, #ff3db4 55%, #ffd23f);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 2px 14px rgba(139,92,246,.35));
        }
        p { color: var(--g-muted); font-size: 14px; line-height: 1.7; margin: 0 0 8px; }
        .link-id {
            font-family: "SF Mono", Consolas, monospace; font-size: 12px; color: rgba(182,168,224,.75);
            background: rgba(23,10,51,.6); border: 1px solid rgba(139,92,246,.3);
            border-radius: 8px; padding: 6px 12px; display: inline-block; margin-top: 4px;
            max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
        a.btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 13px 24px; border-radius: 13px; font-size: 14px; font-weight: 800;
            text-decoration: none; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }
        a.btn.primary {
            background: linear-gradient(135deg, #ff3db4, #8b5cf6 55%, #22d3ee);
            background-size: 180% 180%; animation: driftgrad 5s ease infinite;
            color: #fff; position: relative; overflow: hidden;
            box-shadow: 0 12px 34px rgba(255,61,180,.45);
        }
        a.btn.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 44px rgba(255,61,180,.6); }
        a.btn.ghost { border: 1px solid rgba(139,92,246,.5); color: #b6a8e0; background: transparent; }
        a.btn.ghost:hover { background: rgba(139,92,246,.12); box-shadow: 0 0 18px rgba(139,92,246,.3); }
        @keyframes driftgrad { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .foot { margin-top: 18px; font-size: 11.5px; color: rgba(255,210,63,.6); letter-spacing: .3px; text-shadow: 0 0 12px rgba(255,210,63,.5); }
    </style>
</head>
<body>
<div class="bg-anim"></div>
<div class="sparkles"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
<div class="card" id="card">
    <div class="ic-box" id="ic">🔒</div>
    <div class="tag-pill" id="tag">ACCESS</div>
    <h1 id="title">Chat Unavailable</h1>
    <p id="desc"></p>
    <span class="link-id" id="linkId"></span>
    <div class="actions" id="actions"></div>
    <div class="foot">✦ QUOLVEX AI AI ✦</div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason') || 'unknown';
    const link = params.get('link') || '';
    if (link) document.getElementById('linkId').textContent = 'Chat link: …' + link.slice(-20);
    else document.getElementById('linkId').style.display = 'none';

    const cfgs = {
        login: {
            ic: '🔒',
            icon: 'locked',
            tag: 'Sign-in required',
            tagCls: 'login',
            title: 'You need to log in to view this chat',
            desc: 'This chat lives inside the Quolvex AI app, so we need to know who you are before showing it. Log in or create a free account — your chats stay private to you.',
            actions: [
                { label: '← Back to Quolvex AI', href: '/', cls: 'ghost' },
                { label: 'Log in / Sign up', href: '/', cls: 'primary' },
            ],
        },
        notowner: {
            ic: '👤',
            icon: 'locked',
            tag: 'Private chat',
            tagCls: 'owner',
            title: 'This chat belongs to another account',
            desc: 'You\'re signed in, but this conversation isn\'t yours — chats are private to the account that created them. Open your own space below.',
            actions: [
                { label: 'Quolvex AI home', href: '/', cls: 'ghost' },
                { label: 'Open My App →', href: '/app', cls: 'primary' },
            ],
        },
        notfound: {
            ic: '🕳️',
            icon: 'gone',
            tag: 'Nothing here',
            tagCls: 'gone',
            title: 'This chat doesn\'t exist',
            desc: 'The chat you linked to was deleted, or the link is misspelled. Nothing was lost — your own chats are safe in the app.',
            actions: [
                { label: 'Quolvex AI home', href: '/', cls: 'ghost' },
                { label: 'Open My App →', href: '/app', cls: 'primary' },
            ],
        },
    };
    const c = cfgs[reason] || cfgs.notfound;
    document.getElementById('ic').textContent = c.ic;
    document.getElementById('ic').className = 'ic-box ' + c.icon;
    const tag = document.getElementById('tag');
    tag.textContent = c.tag;
    tag.className = 'tag-pill ' + c.tagCls;
    document.getElementById('title').textContent = c.title;
    document.getElementById('desc').textContent = c.desc;
    document.getElementById('actions').innerHTML = c.actions.map(a =>
        `<a class="btn ${a.cls}" href="${a.href}">${a.label}</a>`).join('');
</script>
</body>
</html>
